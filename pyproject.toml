[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-ai"
version = "0.1.0"
description = "AgentForge AI local vertical slice"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.1",
  "confluent-kafka==2.16.0",
  "alembic==1.20.1",
  "langgraph==1.2.17",
  "langgraph-checkpoint-postgres==3.2.0",
  "openai==3.37.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
