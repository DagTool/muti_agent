name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://agentforge:agentforge_ci@localhost:5432/agentforge_ci
      AGENTFORGE_WORKSPACE_ID: local-dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentforge_ci
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
