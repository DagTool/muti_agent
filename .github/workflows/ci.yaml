name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: AGENTFORGE_DATABASE_URL=sqlite:///./ci-migration.db alembic upgrade head
      - run: AGENTFORGE_DATABASE_URL=sqlite:///./ci-migration.db alembic downgrade base
